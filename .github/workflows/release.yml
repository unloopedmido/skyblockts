name: Release

# Publishes @skyblock-ts/core and @skyblock-ts/toolkit to npm using npm
# Trusted Publishing (OIDC) — no NPM_TOKEN required. The trusted publisher
# for both packages must reference this workflow file (release.yml).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write # required for the OIDC token exchange with npm
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r run build

      # Publishes in dependency order (core before toolkit), rewrites the
      # workspace:^ range to the real version, skips already-published
      # versions, and generates provenance via OIDC.
      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks --provenance
